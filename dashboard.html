<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>لوحة التحكم — جدولي</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0c0a09" />
    <link rel="icon" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="admin/admin.css" />
  </head>
  <body>
    <div class="boot" id="boot" role="status" aria-label="جارٍ التحميل">
      <img src="jadwali-logo.jpg" alt="" />
      <div class="boot-bar"><span></span></div>
    </div>

    <div class="shell" id="app" hidden>
      <div class="scrim" id="scrim" hidden></div>
      <aside class="side" id="side">
        <div class="brand">
          <img src="jadwali-logo.jpg" alt="" />
          <span><strong>جدولي</strong><small>لوحة الإدارة</small></span>
        </div>
        <nav id="nav" aria-label="القائمة الرئيسية"></nav>
        <div class="side-foot">
          <div class="me">
            <span class="avatar" id="avatar">؟</span>
            <span class="me-text"><b id="me-email">—</b><small id="who"></small></span>
          </div>
          <button type="button" class="logout" id="logout">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
            <span>تسجيل الخروج</span>
          </button>
        </div>
      </aside>

      <div class="workspace">
        <header class="topbar">
          <button type="button" class="menu-btn" id="menu-btn" aria-label="فتح القائمة">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          </button>
          <div class="finder">
            <svg class="finder-ico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            <input id="admin-search" type="search" placeholder="ابحث عن شعبة، فصل، مادة، دكتور أو قاعة" autocomplete="off" />
            <div id="search-hits" hidden></div>
          </div>
          <a class="site-link" href="./" target="_blank" rel="noopener">
            <span>موقع الطلبة</span>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7"/><path d="M8 7h9v9"/></svg>
          </a>
        </header>
        <main class="main" id="screen"></main>
      </div>
    </div>

    <div id="confirm" class="modal" hidden>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
        <p class="kicker">تأكيد الحذف</p>
        <h2 id="confirm-title">هيتم حذف الآتي</h2>
        <p id="confirm-text"></p>
        <div class="row">
          <button type="button" class="ghost" id="confirm-no">إلغاء</button>
          <button type="button" class="btn danger-btn" id="confirm-yes">نعم، احذف</button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/supabase-config.js"></script>
    <script src="admin/admin.js"></script>
  </body>
</html>
